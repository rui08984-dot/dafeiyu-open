<!DOCTYPE html>
<html>

<head>

    <title>Live2D桌宠与语音聊天</title>
</head>

<body>

</svg>
    <div id="live2d-container" class="avatar-container">
        <canvas id="canvas"></canvas>
    </div>
    <div id="vrm-container" class="avatar-container" style="display: none;">
        <canvas id="vrm-canvas"></canvas>
    </div>
    <div id="mmd-container" class="avatar-container" style="display: none;">
        <canvas id="mmd-canvas"></canvas>
    </div>
    <div id="avatar-transition" aria-hidden="true">
        <div class="avatar-transition-spinner"></div>
    </div>

    <!-- 桌宠生命力感知光环 / 状态徽章 (Classic Blue-Black Life-Force Aura & State Feedback) -->
    <div id="pet-state-aura" aria-hidden="true">
        <span class="aura-icon"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-sparkles"></use></svg></span>
        <span class="aura-text"></span>
    </div>
    <div id="subtitle-container">
        <div id="subtitle-confirm-btn">确定</div>
        <p id="subtitle-text"></p>
    </div>

    <!-- VRM模型控制面板（展开式） -->
    <div id="model-controls">
        <section id="panel-buttons">
            <button id="btn-toggle-gaze" class="ctrl-btn" title="视线追踪鼠标"><svg class="ico ctrl-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-eye"></use></svg></button>
            <button id="btn-toggle-render" class="ctrl-btn" title="关闭VRM渲染（需VMC启用）"><svg class="ico ctrl-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-eye-off"></use></svg></button>
            <button id="btn-toggle-vmc" class="ctrl-btn" title="VMC数据发送开关"><svg class="ico ctrl-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-radio"></use></svg></button>
            <button id="btn-reset-position" class="ctrl-btn" title="重置相机视角"><svg class="ico ctrl-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-rotate-ccw"></use></svg></button>
            <button id="btn-click-through" class="ctrl-btn" title="鼠标穿透（模型不拦截鼠标）"><svg class="ico ctrl-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-mouse-pointer-2"></use></svg></button>
        </section>
        <button id="btn-toggle-panel" class="ctrl-btn" title="展开控制面板"><svg class="ico ctrl-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-settings"></use></svg></button>
    </div>

    <div id="text-chat-container">
        <div id="chat-messages"></div>
        <div id="chat-input-container">
            <div class="chat-input-frame">
                <div id="chat-input" contenteditable="true" role="textbox" aria-label="输入消息"></div>
                <span class="chat-input-label"><svg class="ico goldfish-dot" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-fish"></use></svg><span>输入消息，回车发送</span></span>
                <span class="chat-input-topline"></span>
                <span class="chat-input-underline"></span>
            </div>
            <button id="chat-send-btn" type="button" hidden aria-hidden="true" tabindex="-1">发送</button>
        </div>
    </div>

    <!-- 歌词气泡容器 -->
    <div id="lyrics-bubble-container">
        <div id="lyrics-bubble-text"></div>
    </div>

    <!-- 气泡框容器 -->
    <div id="bubble-container">
        <div id="bubble-text"></div>
    </div>

    <!-- 工具调用气泡框堆叠容器 -->
    <div id="tool-bubbles-container"></div>

    <!-- 快捷设置面板 -->
    <div id="quick-settings">
        <section id="quick-settings-items">
            <header class="quick-menu-header">
                <span class="quick-header-dot"><svg class="ico goldfish-dot" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-fish"></use></svg></span>
                <span class="quick-header-text">桌宠快捷指令</span>
            </header>
            <span class="quick-section-label">交互</span>
            <button class="quick-item" id="btn-toggle-chat" title="打字框" aria-label="打字框"><span class="quick-item-icon"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-message-square-text"></use></svg></span><span class="quick-item-text">打字框</span></button>
            <button class="quick-item" id="btn-toggle-mode" title="按键录音" aria-label="按键录音"><span class="quick-item-icon"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-mic"></use></svg></span><span class="quick-item-text">按键录音</span><span class="quick-kbd">V</span></button>
            <hr class="quick-item-divider">
            <span class="quick-section-label">才艺</span>
            <button class="quick-item" id="btn-quick-costume" title="随心配换装" aria-label="随心配换装"><span class="quick-item-icon"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-shirt"></use></svg></span><span class="quick-item-text">随心配换装</span></button>
            <button class="quick-item" id="btn-quick-perform" title="才艺演一段" aria-label="才艺演一段"><span class="quick-item-icon"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-drama"></use></svg></span><span class="quick-item-text">才艺演一段</span></button>
            <button class="quick-item" id="btn-quick-gesture" title="换个动作" aria-label="换个动作"><span class="quick-item-icon"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-hand"></use></svg></span><span class="quick-item-text">换个动作</span></button>
            <button class="quick-item" id="btn-quick-mood" title="她现在的心情" aria-label="她现在的心情"><span class="quick-item-icon"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-heart"></use></svg></span><span class="quick-item-text">她现在的心情</span></button>
            <hr class="quick-item-divider">
            <span class="quick-section-label">系统</span>
            <button class="quick-item" id="btn-quick-settings" title="控制中心" aria-label="控制中心"><span class="quick-item-icon"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-settings"></use></svg></span><span class="quick-item-text">控制中心</span></button>
            <button class="quick-item" id="btn-quick-hide" title="先藏起来" aria-label="先藏起来"><span class="quick-item-icon"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-eye-off"></use></svg></span><span class="quick-item-text">先藏起来</span></button>
        </section>
        <div id="quick-gear" title="快捷功能" aria-label="快捷功能"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-settings"></use></svg></div>
    </div>

    <!-- 换装面板：右键快捷菜单「随心配换装」打开。按互斥组排，点一下就穿上，再点一下脱掉。 -->
    <div id="costume-panel" style="display:none">
        <div id="costume-head">
            <span>换装</span>
            <span id="costume-close">×</span>
        </div>
        <div id="costume-body"></div>
    </div>

    <!-- 上游 PIXI 6 + pixi-live2d-display 运行时 -->
    <script src="libs/live2d.min.js"></script>
    <script src="libs/live2dcubismcore.min.js"></script>
<script src="libs/live2dcubismcore.petbody.js"></script>
    <script src="libs/pixi.min.js"></script>
    <script src="libs/pixi-live2d-display.min.js"></script>
    <script src="libs/pixi-live2d-display-extra.min.js"></script>
    <script src="js/avatar/petbody/assets-data.js"></script>
<script src="build/petbody.js"></script>
<script src="app.js"></script>


</body>

</html>
