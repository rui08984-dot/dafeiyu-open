<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>大肥鱼 · pet-runtime</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="ui/stage.css">
</head>
<body>
<canvas id="model" aria-label="大肥鱼 Live2D 皮套"></canvas>

<!-- 舞台 UI：默认全部不吃指针，只有需要交互的控件才接管 -->
<div id="stage-ui">
  <!-- 字幕：68% ~ 78% 高度区间，不挡脸 -->
  <div id="caption" class="caption" aria-live="polite" aria-hidden="true">
    <p id="caption-text" class="caption-text"></p>
    <button id="caption-close" class="caption-close" type="button" title="关闭字幕" aria-label="关闭字幕">×</button>
  </div>

  <!-- 点身子时的小反应气泡 -->
  <div id="reaction" class="reaction" aria-hidden="true"><span id="reaction-text"></span></div>

  <!-- 轻提示 / 操作反馈 -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- 悬停浮出的圆钮 -->
  <div id="dock" class="dock" aria-label="快捷操作">
    <button type="button" class="dock-btn" data-panel="expression" data-tip="表情" aria-label="打开表情面板">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.2"/><path d="M8.7 14.1c.9 1.3 2 2 3.3 2s2.4-.7 3.3-2"/><circle class="dot" cx="9.4" cy="10.2" r="1"/><circle class="dot" cx="14.6" cy="10.2" r="1"/></svg>
    </button>
    <button type="button" class="dock-btn" data-panel="motion" data-tip="动作" aria-label="打开动作面板">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.2"/><path class="fill" d="M9.6 8.4v7.2L15.8 12z"/></svg>
    </button>
    <button type="button" class="dock-btn" data-panel="asset" data-tip="换装" aria-label="打开换装面板">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5.6 5.3 8.1l1.6 3.2 1.7-.7V19h6.8v-8.4l1.7.7 1.6-3.2L15 5.6c-.7 1.5-1.7 2.2-3 2.2s-2.3-.7-3-2.2Z"/></svg>
    </button>
  </div>

  <!-- 控制面板（右侧抽屉） -->
  <aside id="panel" class="panel" aria-label="控制面板" aria-hidden="true">
    <header class="panel-head">
      <div class="panel-title"><span class="panel-dot" aria-hidden="true"></span>控制面板</div>
      <button id="panel-close" class="panel-close" type="button" title="收起面板" aria-label="收起面板">×</button>
    </header>
    <nav class="panel-tabs" role="tablist" aria-label="面板分类">
      <button type="button" class="panel-tab" role="tab" data-tab="expression" aria-selected="true">表情<em id="count-expression">0</em></button>
      <button type="button" class="panel-tab" role="tab" data-tab="motion" aria-selected="false">动作<em id="count-motion">0</em></button>
      <button type="button" class="panel-tab" role="tab" data-tab="asset" aria-selected="false">换装<em id="count-asset">0</em></button>
    </nav>
    <div class="panel-body">
      <section class="panel-view" data-view="expression" aria-label="表情列表">
        <div id="expression-grid" class="chips"></div>
        <p class="panel-tip">点一下戴上，再点一下取下；同一时间只保留一个表情。</p>
      </section>
      <section class="panel-view" data-view="motion" aria-label="动作列表" hidden>
        <div id="motion-list" class="rows"></div>
        <p class="panel-tip">播放皮套自带的动作，播完自动回到自然待机。</p>
      </section>
      <section class="panel-view" data-view="asset" aria-label="换装列表" hidden>
        <div id="asset-groups" class="asset-groups"></div>
        <p class="panel-tip">开关通过资产目录（C）的 applyAsset 生效，可随时切回。</p>
      </section>
    </div>
    <footer class="panel-foot">
      <span id="panel-status">按住角色可拖动窗口</span>
    </footer>
  </aside>
</div>

<div id="status" class="status">booting…</div>

<script>
  // Harness only: mirror page errors into the static server so headless runs explain themselves.
  window.process = window.process || { env: {}, platform: 'browser' };
  if (new URLSearchParams(location.search).get('slow')) { const i = new Image(); i.src = '/slow?ms=' + new URLSearchParams(location.search).get('slow'); i.style.display = 'none'; document.body.appendChild(i); }
  if (location.protocol === 'http:' && location.port !== '') {
    var rf = window.fetch.bind(window);
    var send = function (o) { try { rf('/__log', { method: 'POST', body: JSON.stringify(o) }); } catch (e) {} };
    window.addEventListener('error', function (e) { send({ stage: 'window-error', msg: String(e.message || '') + ' @' + String(e.filename||'').split('/').pop() + ':' + e.lineno }); });
    window.addEventListener('unhandledrejection', function (e) { send({ stage: 'rejection', msg: String(e.reason && (e.reason.stack || e.reason) || '') .slice(0, 500) }); });
    var ce = console.error; console.error = function () { var a = Array.prototype.slice.call(arguments); send({ stage: 'console-error', msg: a.map(String).join(' ').slice(0, 500) }); ce.apply(console, a); };
    var st = document.getElementById('status');
    new MutationObserver(function () { send({ stage: 'status', text: st.textContent }); }).observe(st, { childList: true, characterData: true, subtree: true });
    setInterval(function () { var p = window.__pet; if (p) send({ stage: 'alive', ready: !!p.renderer.ready, mouth: p.state.mouth, mask: p.renderer.maskConfig, stage: p.stage ? p.stage.debugState() : null }); }, 3000);
  }
</script>
<script src="vendor/cubism/Core/live2dcubismcore.min.js"></script>
<script type="module" src="build/app.js"></script>
</body>
</html>
